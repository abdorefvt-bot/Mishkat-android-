name: Build Mishkat Fresh APK
on:
  workflow_dispatch:
  push:
    branches: [ "fresh-mishkat-2026" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate high-resolution launcher icons from original SVG
        run: |
          python3 -m pip install --user cairosvg pillow
          python3 .github/scripts/generate_icons.py
      - name: Build fresh debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mishkat-Fresh-v1.0.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
