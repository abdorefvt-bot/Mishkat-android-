# Build trigger: alternating Quran/adhkar reminders, native media controls, and high-resolution SVG launcher assets.
name: Build Mishkat APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate launcher icons from original Canva SVG
        run: |
          python3 -m pip install --user cairosvg pillow
          python3 .github/scripts/generate_icons.py
      - name: Decode bundled widget fonts
        run: python3 .github/scripts/decode_widget_fonts.py
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mishkat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
